server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 50M;

    # Let's Encrypt HTTP-01 challenges (certbot --webroot, automatic renewal): served here, never redirected to HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /etc/letsencrypt/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Allow EC2 instances and intra-VPC calls to reach API over raw HTTP (without SSL)
    location ~ ^/api/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://18-185-5-251.nip.io$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 18-185-5-251.nip.io;
    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/18-185-5-251.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/18-185-5-251.nip.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
