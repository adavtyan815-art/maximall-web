<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MaxiMall 3D AR Viewer</title>
    <!-- Google model-viewer for WebXR and Apple AR Quick Look -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #1b2230 0%, #0d1117 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }
        #container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        header {
            position: absolute;
            top: 16px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }
        .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #f39c12;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .badge {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.15);
        }
        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }
        .ar-button {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            padding: 16px 36px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 25px rgba(243, 156, 18, 0.45);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 20;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .ar-button:active {
            transform: translateX(-50%) scale(0.96);
        }
        .instructions {
            position: absolute;
            bottom: 96px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 13px;
            color: rgba(255,255,255,0.6);
            pointer-events: none;
            z-index: 10;
        }
        #loading-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(13, 17, 23, 0.95);
            z-index: 100;
            transition: opacity 0.4s ease;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #f39c12;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <p style="font-weight: 600; font-size: 15px;">Загрузка 3D-модели…</p>
    </div>

    <div id="container">
        <header>
            <div class="logo">MAXIMALL AR</div>
            <div class="badge">1:1 TRUE SCALE</div>
        </header>

        <model-viewer 
            id="ar-viewer"
            camera-controls
            touch-action="pan-y"
            auto-rotate
            rotation-per-second="25deg"
            shadow-intensity="1.5"
            shadow-softness="0.8"
            environment-image="neutral"
            exposure="1.0"
            ar
            ar-modes="webxr scene-viewer quick-look"
            ar-scale="auto"
            alt="MaxiMall Custom Furniture">
            
            <button slot="ar-button" class="ar-button">
                <span>📍 Примерить в комнате</span>
            </button>
        </model-viewer>

        <div class="instructions">Вращайте одним пальцем • Масштабируйте двумя</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let modelParam = urlParams.get('model') || urlParams.get('m');

        const viewer = document.querySelector('#ar-viewer');
        const loadingOverlay = document.querySelector('#loading-overlay');

        function resolveModelSrc(param) {
            if (!param) return null;
            if (param.startsWith('http://') || param.startsWith('https://') || param.startsWith('/')) {
                return param;
            }
            return '/ar/models/' + encodeURIComponent(param);
        }

        function loadModel(src) {
            viewer.src = src;
            viewer.addEventListener('load', () => {
                loadingOverlay.style.opacity = '0';
                setTimeout(() => {
                    loadingOverlay.style.display = 'none';
                }, 400);

                if (viewer.canActivateAR) {
                    console.log("Device supports AR. Ready to place.");
                }
            }, { once: true });

            viewer.addEventListener('error', (err) => {
                console.error("Error loading model:", err);
                loadingOverlay.innerHTML = '<p style="color:#e74c3c;font-weight:bold;text-align:center;padding:20px;">Не удалось загрузить 3D-модель.<br><small style="color:#aaa;">' + src + '</small></p>';
            });
        }

        const modelSrc = resolveModelSrc(modelParam);
        if (modelSrc) {
            loadModel(modelSrc);
        } else {
            loadingOverlay.innerHTML = '<p style="color:#e74c3c;font-weight:bold;">Модель не указана в ссылке (?model=...)</p>';
        }
    </script>
</body>
</html>
