<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — MaxiMall</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/brand/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Design language: MaxiMall Splash — full-screen dark stage */
    :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 40px 24px;
      background: #0e0e0e;
      font-family: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }
    .login-card {
      position: relative;
      width: 420px;
      max-width: 100%;
      padding: 48px 44px 44px;
      background: transparent;
    }
    .path {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 30px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.30em;
      text-indent: 0.30em;
    }
    .path__mall { color: #8c8c8c; }
    .path__here { color: #ffffff; }
    .path__chevron { width: 5px; height: 5px; border-right: 1px solid #6e6e6e; border-top: 1px solid #6e6e6e; transform: rotate(45deg); text-indent: 0; }
    .login-card h2 {
      margin: 0 0 32px;
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-indent: 0.16em;
      text-transform: uppercase;
      text-align: center;
      color: #ffffff;
    }
    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #8c8c8c;
    }
    input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      color: #ffffff;
      font: inherit;
      font-size: 15px;
      transition: border-color 160ms ease, background-color 160ms ease;
    }
    input:hover { border-color: rgba(255, 255, 255, 0.22); }
    input:focus { outline: none; border-color: rgba(255, 255, 255, 0.6); background: rgba(255, 255, 255, 0.06); }
    button {
      width: 100%;
      height: 44px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.92);
      color: #0e0e0e;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: background-color 160ms ease, transform 120ms ease;
    }
    button:hover { background: #ffffff; }
    button:active { background: #f2f0ed; transform: scale(0.98); }
    button:focus-visible { outline: 2px solid #ffffff; outline-offset: 3px; }
    .error {
      display: none;
      margin-top: 16px;
      font-size: 13px;
      font-weight: 500;
      color: #ffffff;
      text-align: center;
    }
    .error::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin: 0 8px 1px 0;
      border-radius: 50%;
      background: #ffffff;
      vertical-align: middle;
    }
    .foot { font-size: 11px; color: #6e6e6e; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="path">
      <span class="path__mall">MAXIMALL</span>
      <span class="path__chevron" aria-hidden="true"></span>
      <span class="path__here">ПАНЕЛЬ</span>
    </div>
    <h2>Вход</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Логин</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Войти</button>
      <div id="errorMsg" class="error">Неверный логин или пароль</div>
    </form>
  </div>
  <span class="foot">© Maxi Mall</span>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();
      if (data.success) {
        window.location.href = '/admin.html';
      } else {
        document.getElementById('errorMsg').style.display = 'block';
      }
    });
  </script>
</body>
</html>
